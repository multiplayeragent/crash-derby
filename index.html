/* ═══ CRASH DERBY · a Multiplayer Agent starter ═══════════════════════════════════════

 *   EFFECTS ....... smoke, dust, sparks, flying car parts, sound
 *   CARS .......... the car model (dents, loose parts, health bar), and ONE physics
 *                   function that drives any car: yours, a bot, everyone's
 *   CRASHES ....... how two cars touch, bounce, and who takes how much damage
 *   ROUND (HOST) .. the round phases (grid, fight, done) and the bots. Only the host writes these.
 *   MY CAR ........ driving, boost, my own crashes. Each player writes only its own car.
 *   HUD & RESULTS . health, boost, cars left, kill feed, results, leaderboard
 *   INPUT ......... keyboard and touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player drives its OWN car with its own physics and writes its own entity: `k`
 *     (one packed JSON field: round id, position, heading, velocity, health, boost, where
 *     it was last hit, score, wrecked) about 15 times a second, `hb` (heartbeat) once a
 *     second, and `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `round` (id, version
 *     `v`, phase, start and end times, results) and `bots`. A new host adopts both.
 *   - Crashes: each client checks its OWN car against everyone it draws, bounces itself,
 *     and tells the other car with the event "ram" {to, sp, x, z}: sp is how fast it came
 *     in. The car that got hit (the VICTIM) decides its own damage from sp and where it was
 *     hit (side hits hurt most), then answers "dmg" {to, n, ko, v} so the rammer scores.
 *     The host does all of this for the bots (bot hits bot, bot hits you).
 *   - Health lives in each car's own state, so dents, smoke and loose parts show the same
 *     for everyone (a view dents where state says the last hit landed).
 *   - Intent: "again" {} from the results card asks the host to start the next round now.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "derby-score": damage dealt + 40 per wreck + 100 for the win, per round.

// Sky: a dusty sunset dome.
const skyGeo = new THREE.SphereGeometry(600, 32, 16), skyCol = [];
const SKY = [[-1, "#5a3040"], [0, "#f0a070"], [0.12, "#e07a6a"], [0.35, "#7a4a8a"], [1, "#2a1a4a"]].map(([y, c]) => [y, new THREE.Color(c)]);

const groundGeo = new THREE.BufferGeometry();
{

document.body.classList.toggle("touch", touchUI);
const KEYS = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right", ArrowUp: "gas", w: "gas", W: "gas", ArrowDown: "rev", s: "rev", S: "rev", Shift: "boost", " ": "boost" };
addEventListener("keydown", (e) => { wakeAudio(); const k = KEYS[e.key]; if (k) { e.preventDefault(); input[k] = true; } });
addEventListener("keyup", (e) => { const k = KEYS[e.key]; if (k) input[k] = false; });
for (const b of document.querySelectorAll(".pad button")) {
  const k = b.dataset.k, on = (v) => { input[k] = v; b.classList.toggle("on", v); };
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); b.setPointerCapture(e.pointerId); on(true); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => on(false));
}
renderer.domElement.addEventListener("pointerdown", wakeAudio);
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
const views = new Map(); // id -> drawn car for everyone but me: { g, x, z, h, vx, vz, live, out, ... }
function viewOf(id, color, name) {
  let v = views.get(id);
  if (v && v.color !== color) { scene.remove(v.g); views.delete(id); v = null; } // they changed color
  if (!v) { v = Object.assign(makeCar(id, color, ATTRACT ? "" : name), { x: 0, z: 0, h: 0, vx: 0, vz: 0, raw: "", fresh: true }); views.set(id, v); }
  return v;
}
/** Ease a drawn car toward where it said it was, plus how far it has driven since. */
function follow(v, k, dt, now, exact) {
  if (exact) { Object.assign(v, { x: k.x, z: k.z, h: k.h, vx: k.vx, vz: k.vz }); return; }
  const key = `${k.x},${k.z},${k.h}`;
  if (v.raw !== key) Object.assign(v, { raw: key, sx: k.x, sz: k.z, sh: k.h, vx: k.vx || 0, vz: k.vz || 0, at: now });
  const age = Math.min(0.25, (now - v.at) / 1000), tx = v.sx + v.vx * age, tz = v.sz + v.vz * age;
  if (v.fresh || Math.hypot(tx - v.x, tz - v.z) > 12) Object.assign(v, { x: tx, z: tz, h: v.sh, fresh: false });
  const e = 1 - Math.pow(0.001, dt);
  v.x += (tx - v.x) * e; v.z += (tz - v.z) * e; v.h = angle(v.h + angle(v.sh - v.h) * e);
}
function drawView(v, k, dt) {
  if (showDamage(v, k.hp, k.hd, !!k.o)) { scene.remove(v.g); views.delete(v.id); return; }
  const sp = (v.vx * Math.sin(v.h) + v.vz * Math.cos(v.h));
  placeCar(v, v.x, v.z, v.h, sp, k.s || 0, !!k.b, dt);
}
let last = performance.now(), lastHb = 0, lastHud = 0, camH = 0, watchId = ""; // watchId: the car the camera follows once I am out
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the round meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (touchUI) input.gas = !input.rev; // touch drives on its own
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const r = round();
  if (r) myTick(dt, r, now);
  // everyone else's cars
  const seen = new Set(), live = new Set(livePlayers());
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const k = parse(p.k, null); if (!k || !r || k.r !== r.id || k.sp) continue;
    seen.add(id); const v = viewOf(id, p.c || "#ccc", p.n || "Player"); v.id = id; v.live = true;
    follow(v, k, dt, now, false); drawView(v, k, dt);
  }
  const hostBots = isHost();
  for (const b of botList()) {
    seen.add(b.i); const v = viewOf(b.i, b.c, b.n); v.id = b.i; v.live = true;
    follow(v, b, dt, now, hostBots); drawView(v, b, dt);
  }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); }
  // my car
  if (!me.spec) {
    if (!me.v) me.v = makeCar(net.sessionId, myColor, "");
    if (showDamage(me.v, me.c.hp, me.c.hd, me.c.out)) { scene.remove(me.v.g); me.v = makeCar(net.sessionId, myColor, ""); }
    me.v.tag.visible = false;
    placeCar(me.v, me.c.x, me.c.z, me.c.h, me.c.speed || 0, me.c.steer || 0, !!me.c.boosting, dt);
  } else if (me.v) { scene.remove(me.v.g); me.v = null; }
  smoke.tick(dt); sparks.tick(dt); tickDebris(dt);
  // the crowd bounces
  for (let i = 0; i < FANS; i += 3) { const f = fanBase[i]; mtx.makeTranslation(f[0], f[1] + Math.max(0, Math.sin(now / 160 + f[3])) * 0.35, f[2]); fans.setMatrixAt(i, mtx); }
  fans.instanceMatrix.needsUpdate = true;
  // camera: chase my car, or follow another one when I'm out
  me.shake = Math.max(0, me.shake - dt * 3);
  if (!me.spec && !me.c.out) {
    camH = angle(camH + angle(me.c.h - camH) * Math.min(1, dt * 4));
    const back = camera.aspect < 1 ? 13 : ATTRACT ? 12 : 10.5, up = camera.aspect < 1 ? 7.5 : ATTRACT ? 7 : 5.5;
    camPos.set(me.c.x - Math.sin(camH) * back, groundY(me.c.x, me.c.z) + up, me.c.z - Math.cos(camH) * back);
    const cr = Math.hypot(camPos.x, camPos.z), lim = RW - 4; // never back out through the wall: rise over the car instead
    if (cr > lim) { camPos.x *= lim / cr; camPos.z *= lim / cr; camPos.y += (cr - lim) * 0.8; }
    camLook.set(me.c.x + Math.sin(camH) * 5, groundY(me.c.x, me.c.z) + 1.2, me.c.z + Math.cos(camH) * 5);
    camera.position.lerp(camPos, 1 - Math.pow(0.001, dt));
  } else {
    let w = views.get(watchId);
    if (!w || w.out) { // follow the car nearest the camera that is still running
      w = null; let best = Infinity;
      for (const [id, v] of views) { const d = Math.hypot(v.x - camera.position.x, v.z - camera.position.z); if (!v.out && d < best) { best = d; w = v; watchId = id; } }
    }
    if (w) {
      camH = angle(camH + angle(w.h - camH) * Math.min(1, dt * 2));
      camPos.set(w.x - Math.sin(camH) * 15, groundY(w.x, w.z) + 9, w.z - Math.cos(camH) * 15);
      const cr = Math.hypot(camPos.x, camPos.z), lim = RW - 4;
      if (cr > lim) { camPos.x *= lim / cr; camPos.z *= lim / cr; camPos.y += (cr - lim) * 0.8; }
      camLook.lerp(new THREE.Vector3(w.x, groundY(w.x, w.z) + 1, w.z), 1 - Math.pow(0.01, dt));
    } else { camPos.set(0, 30, -40); camLook.lerp(new THREE.Vector3(), 1 - Math.pow(0.05, dt)); }
    camera.position.lerp(camPos, 1 - Math.pow(0.03, dt));
  }
  if (me.shake) camera.position.add(new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(me.shake * 0.7));
  camera.lookAt(camLook);
  const fov = (camera.aspect < 1 ? 78 : 66) + (me.c.boosting ? 10 : 0);
  camera.fov += (fov - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  if (r && now - lastHud > 100) { lastHud = now; hud(r, now); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("ram", (msg, from) => onRam(msg, (msg && msg.f) || from)); // f: the bot that rammed (the host sends for its bots)
  net.on("dmg", (msg) => { if (!msg) return; if (msg.to === net.sessionId || (isHost() && host.bots.has(msg.to))) credit(msg.to, msg.n, !!msg.ko, msg.v); else if (msg.ko) feed(msg.to, msg.v); });
  net.on("again", () => again());
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { countdown: 1500, resultsFor: 1500, seats: 6, dmgPerSpeed: 1 }); // the preview: harder hits, so smoke and flying parts show early
  started = performance.now();
  if (new URLSearchParams(location.search).has("test")) window.__test = { scene, round, botList, me, standings: () => standings(round()) }; // for test scripts only
  requestAnimationFrame(frame);
})();
</script>
